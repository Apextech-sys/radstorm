# FreeRADIUS client authorisation for the radstorm test rig
#
# Purpose:
#   Defines which NAS clients FreeRADIUS will accept packets from.
#   The rig needs to accept packets from:
#     - other containers on the Docker bridge (the smoke sidecar uses docker network)
#     - the host machine running radstorm (via host.docker.internal / 127.0.0.1)
#   We use a single wildcard entry for the Docker network plus explicit host entries.
#
# Related: test/docker/docker-compose.yml, test/docker/freeradius/Dockerfile
# Briefing: .orchestration/briefings/1e-docker-rig.md
# Contract: shared secret is "testing123" for all clients; do NOT change without
#           updating docker-compose.yml, smoke.sh, and scenario TOML fixtures.

# ── Docker bridge and any container in the compose network ───────────────────
client docker_any {
    ipaddr          = 0.0.0.0/0
    secret          = testing123
    shortname       = docker_any
    nas_type        = other
    require_message_authenticator = no
}

# ── Host machine reaching the container via localhost (mapped port 11812/11813)
client localhost_host {
    ipaddr          = 127.0.0.1
    secret          = testing123
    shortname       = localhost
    nas_type        = other
    require_message_authenticator = no
}
